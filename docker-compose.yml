services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: rent, POSTGRES_PASSWORD: rent, POSTGRES_DB: rentagent }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://rent:rent@postgres:5432/rentagent
      CHECKPOINT_URL: postgresql://rent:rent@postgres:5432/rentagent
      REDIS_URL: redis://redis:6379/0
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://rent:rent@postgres:5432/rentagent
      CHECKPOINT_URL: postgresql://rent:rent@postgres:5432/rentagent
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.worker.celery worker -B -l info
    depends_on: [postgres, redis]
  web:
    build: ./frontend
    environment: { BACKEND_URL: "http://api:8000", NEXT_PUBLIC_WS_URL: "ws://localhost:8000/ws" }
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
